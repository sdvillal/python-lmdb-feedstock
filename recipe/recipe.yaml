schema_version: 1

context:
  version: "2.2.0"

package:
  name: python-lmdb
  version: ${{ version }}

source:
  url: https://github.com/jnwatson/py-lmdb/archive/refs/tags/py-lmdb_${{ version }}.tar.gz
  sha256: 050f04fc9671e1e3a9871e06e5e5b09eb9624d6cad53f2f4c637bca5293d986b
  patches:
    - 0001-typedef-pid_t-on-win.patch

build:
  number: 1
  script:
    - if: aarch64
      then: |
        export CFLAGS="${CFLAGS} -pthread"
        export CXXFLAGS="${CXXFLAGS} -pthread"
    - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

  skip:
    - not aarch64
    - match(python, "<3.14")

requirements:
  build:
    # Bring back cross-compilation for pcc64le
    - ${{ stdlib("c") }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - if: unix
      then: patch
  host:
    - python
    - setuptools
    - if: win
      then: patch-ng
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - lmdb
  - files:
      source:
        - tests
    requirements:
      run:
        - pip
        - pytest
    script:
      - if: linux and aarch64
        then: |
          # Test: does the wheel also fail?
          conda uninstall python-lmdb -y
          pip install lmdb --no-cache-dir
          pytest -vvv
          # pytest -k "not test_max_readers" -vvv
        else: pytest -vvv

about:
  license: OLDAP-2.8
  license_file: LICENSE
  summary: Universal Python binding for the LMDB 'Lightning' Database
  description: |
    LMDB is a fast, memory-efficient, embedded key-value store (it does
    not require running an external daemon).
    With memory-mapped files, it has the read performance of a pure
    in-memory database while retaining the persistence of standard
    disk-based databases.
    python-lmdb is a Python binding for LMDB including a bundled
    version of LMDB.
  homepage: https://lmdb.readthedocs.io/
  repository: https://github.com/jnwatson/py-lmdb
  documentation: https://lmdb.readthedocs.io/

extra:
  recipe-maintainers:
    - pitrou
    - h-vetinari
    - xhochy
